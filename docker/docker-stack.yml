version: "3.9"

services:
  init_permissions:
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        set -e
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - default
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy:
        condition: none

  api:
    image: langgenius/dify-api:1.17.1
    env_file:
      - .env
    environment:
      MODE: api
      # Sem servidor de e-mail neste ambiente: vazio faz o Dify avisar na tela de convite
      # e mostrar o link de ativação, em vez de tentar o Resend padrão do .env sem chave.
      # Para habilitar e-mail, remova esta linha e configure MAIL_TYPE/SMTP_* no .env.
      MAIL_TYPE: ""
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${API_SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_PROFILES_SAMPLE_RATE: ${API_SENTRY_PROFILES_SAMPLE_RATE:-1.0}
      PLUGIN_REMOTE_INSTALL_HOST: ${EXPOSE_PLUGIN_DEBUGGING_HOST:-localhost}
      PLUGIN_REMOTE_INSTALL_PORT: ${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PLUGIN_DAEMON_TIMEOUT: ${PLUGIN_DAEMON_TIMEOUT:-600.0}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
    volumes:
      - dify_app_storage:/app/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # O Swarm mata tarefas unhealthy (o Compose não). Na primeira subida o
      # `flask upgrade-db` leva vários minutos (~6 min no WSL); com 30s a API era
      # morta em loop no meio da migração e o nginx não resolvia `dify_api`.
      start_period: 15m
    networks:
      - default
      - ssrf_proxy_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first

  worker:
    image: langgenius/dify-api:1.17.1
    env_file:
      - .env
    environment:
      MODE: worker
      # Sem servidor de e-mail neste ambiente: vazio faz o Dify avisar na tela de convite
      # e mostrar o link de ativação, em vez de tentar o Resend padrão do .env sem chave.
      # Para habilitar e-mail, remova esta linha e configure MAIL_TYPE/SMTP_* no .env.
      MAIL_TYPE: ""
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${API_SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_PROFILES_SAMPLE_RATE: ${API_SENTRY_PROFILES_SAMPLE_RATE:-1.0}
      PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - default
      - ssrf_proxy_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first

  worker_beat:
    image: langgenius/dify-api:1.17.1
    env_file:
      - .env
    environment:
      MODE: beat
      # Sem servidor de e-mail neste ambiente: vazio faz o Dify avisar na tela de convite
      # e mostrar o link de ativação, em vez de tentar o Resend padrão do .env sem chave.
      # Para habilitar e-mail, remova esta linha e configure MAIL_TYPE/SMTP_* no .env.
      MAIL_TYPE: ""
    networks:
      - default
      - ssrf_proxy_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first

  web:
    image: langgenius/dify-web:1.17.1
    env_file:
      - .env
    environment:
      # CA interna usada pelo SSR do Next.js ao chamar o domínio público via HTTPS.
      NODE_EXTRA_CA_CERTS: /etc/ssl/dify/extra-ca.pem
    configs:
      - source: dify_web_extra_ca
        target: /etc/ssl/dify/extra-ca.pem
        mode: 0444
    # O domínio público (ex.: *.dti) só existe no hosts de quem navega; o SSR do
    # Next.js dentro do container precisa desta entrada para chamar CONSOLE_API_URL.
    # Os dois valores vêm do .env de cada ambiente (veja a seção 8 do README.swarm.md).
    extra_hosts:
      - "${DIFY_PUBLIC_HOST:?defina DIFY_PUBLIC_HOST no .env (domínio público do Dify)}:${DIFY_PUBLIC_HOST_IP:?defina DIFY_PUBLIC_HOST_IP no .env (IP que alcança o NGPM na 443)}"
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first

  db_postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
               -c 'statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-0}'
               -c 'idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-0}'
    volumes:
      - dify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-dify}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Na primeira subida o initdb leva quase 2 min no WSL; com 30s o Swarm quase
      # matou o Postgres no meio dele, o que deixaria o volume do banco pela metade.
      start_period: 5m
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:6-alpine
    env_file:
      - .env
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-difyai123456}
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}
    volumes:
      - dify_redis_data:/data
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    env_file:
      - .env
    environment:
      PERSISTENCE_DATA_PATH: ${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
      QUERY_DEFAULTS_LIMIT: ${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED:-false}
      DEFAULT_VECTORIZER_MODULE: ${WEAVIATE_DEFAULT_VECTORIZER_MODULE:-none}
      CLUSTER_HOSTNAME: ${WEAVIATE_CLUSTER_HOSTNAME:-node1}
      AUTHENTICATION_APIKEY_ENABLED: ${WEAVIATE_AUTHENTICATION_APIKEY_ENABLED:-true}
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_AUTHENTICATION_APIKEY_ALLOWED_KEYS:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_AUTHENTICATION_APIKEY_USERS:-hello@dify.ai}
      AUTHORIZATION_ADMINLIST_ENABLED: ${WEAVIATE_AUTHORIZATION_ADMINLIST_ENABLED:-true}
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_AUTHORIZATION_ADMINLIST_USERS:-hello@dify.ai}
      DISABLE_TELEMETRY: ${WEAVIATE_DISABLE_TELEMETRY:-false}
      ENABLE_TOKENIZER_GSE: ${WEAVIATE_ENABLE_TOKENIZER_GSE:-false}
      ENABLE_TOKENIZER_KAGOME_JA: ${WEAVIATE_ENABLE_TOKENIZER_KAGOME_JA:-false}
      ENABLE_TOKENIZER_KAGOME_KR: ${WEAVIATE_ENABLE_TOKENIZER_KAGOME_KR:-false}
    volumes:
      - dify_weaviate_data:/var/lib/weaviate
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    env_file:
      - .env
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: ${SANDBOX_GIN_MODE:-release}
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-http://ssrf_proxy:3128}
      HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-http://ssrf_proxy:3128}
      SANDBOX_PORT: ${SANDBOX_PORT:-8194}
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
    volumes:
      - dify_sandbox_dependencies:/dependencies
      - dify_sandbox_conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ssrf_proxy_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  ssrf_proxy:
    image: ubuntu/squid:latest
    env_file:
      - .env
    configs:
      - source: dify_ssrf_squid_conf_template
        target: /etc/squid/squid.conf.template
        mode: 0444
      - source: dify_ssrf_entrypoint
        target: /docker-entrypoint-mount.sh
        mode: 0555
    entrypoint:
      - sh
      - -c
      - cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      REVERSE_PROXY_PORT: ${SSRF_REVERSE_PROXY_PORT:-8194}
      SANDBOX_HOST: ${SSRF_SANDBOX_HOST:-sandbox}
      SANDBOX_PORT: ${SANDBOX_PORT:-8194}
    networks:
      - default
      - ssrf_proxy_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    env_file:
      - .env
    environment:
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
    volumes:
      - dify_plugin_storage:/app/storage
    ports:
      - target: ${PLUGIN_DEBUGGING_PORT:-5003}
        published: ${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}
        protocol: tcp
        mode: ingress
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  nginx:
    image: nginx:latest
    env_file:
      - .env
    configs:
      - source: dify_nginx_conf_template
        target: /etc/nginx/nginx.conf.template
        mode: 0444
      - source: dify_nginx_proxy_conf_template
        target: /etc/nginx/proxy.conf.template
        mode: 0444
      - source: dify_nginx_https_conf_template
        target: /etc/nginx/https.conf.template
        mode: 0444
      - source: dify_nginx_swarm_default_conf_template
        target: /etc/nginx/conf.d/default.conf.template
        mode: 0444
      - source: dify_nginx_entrypoint
        target: /docker-entrypoint-mount.sh
        mode: 0555
    volumes:
      - dify_nginx_ssl:/etc/ssl
      - dify_certbot_live:/etc/letsencrypt/live
      - dify_certbot_conf:/etc/letsencrypt
      - dify_certbot_www:/var/www/html
    environment:
      # Nome da stack (ex.: dify_hmg), usado no template do nginx para montar os
      # nomes completos dos serviços (<stack>_api, <stack>_web, <stack>_plugin_daemon).
      DIFY_STACK_NAME: '{{index .Service.Labels "com.docker.stack.namespace"}}'
    entrypoint:
      - sh
      - -c
      - cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh
    networks:
      - default
      - net_nginx_pm
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first

  kb_assets:
    image: nginx:alpine
    configs:
      - source: dify_kb_assets_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    volumes:
      - dify_kb_assets:/usr/share/nginx/html/kb-assets:ro
    networks:
      - net_nginx_pm
    deploy:
      replicas: 1
      # Volume local compartilhado com o kb_admin: os dois ficam no mesmo nó.
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first

  # Interface web de publicação das imagens da base de conhecimento (docker/kb_admin).
  # A imagem é construída pelo deploy.sh, que exporta KB_ADMIN_IMAGE com uma tag do ID da imagem.
  kb_admin:
    image: ${KB_ADMIN_IMAGE:?defina KB_ADMIN_IMAGE rodando o docker/deploy.sh}
    env_file:
      - .env
    environment:
      KB_ASSETS_DIR: /data/kb-assets
      KB_ADMIN_DATA_DIR: /data/admin
      # Nome completo (<stack>_api), como no nginx, para não alcançar a api de outra stack.
      DIFY_API_URL: 'http://{{index .Service.Labels "com.docker.stack.namespace"}}_api:5001'
    volumes:
      - dify_kb_assets:/data/kb-assets
      - dify_kb_admin_data:/data/admin
    networks:
      - default
      - net_nginx_pm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: stop-first

networks:
  default:
    driver: overlay
    attachable: true
  ssrf_proxy_network:
    driver: overlay
    internal: true
    attachable: true
  net_nginx_pm:
    external: true
    # Rede compartilhada com o Nginx Proxy Manager; troque via .env se o ambiente usar outro nome.
    name: ${DIFY_PROXY_NETWORK:-net_nginx_pm}

configs:
  # Certificado público da CA interna (não versionado). Ao trocar o arquivo,
  # renomeie este config ou remova a stack, pois configs do Swarm são imutáveis.
  dify_web_extra_ca:
    file: ${DIFY_EXTRA_CA_FILE:-./certs/no-extra-ca.pem}
  dify_ssrf_squid_conf_template:
    file: ./ssrf_proxy/squid.conf.template
  dify_ssrf_entrypoint:
    file: ./ssrf_proxy/docker-entrypoint.sh
  dify_nginx_conf_template:
    file: ./nginx/nginx.conf.template
  dify_nginx_proxy_conf_template:
    file: ./nginx/proxy.conf.template
  dify_nginx_https_conf_template:
    file: ./nginx/https.conf.template
  dify_nginx_entrypoint:
    file: ./nginx/docker-entrypoint.sh
  # Nome com o hash do arquivo (exportado pelo deploy.sh): configs do Swarm são imutáveis,
  # então cada versão do default.conf vira um config novo e o serviço é atualizado.
  dify_kb_assets_conf:
    name: dify_kb_assets_conf_${KB_ASSETS_CONF_HASH:?defina KB_ASSETS_CONF_HASH rodando o docker/deploy.sh}
    file: ./kb_assets/default.conf
  # Template específico do Swarm (upstreams pelos nomes completos <stack>_api/_web/_plugin_daemon).
  dify_nginx_swarm_default_conf_template:
    file: ./nginx/swarm/default.conf.template

volumes:
  dify_app_storage:
  dify_postgres_data:
  dify_redis_data:
  dify_weaviate_data:
  dify_sandbox_dependencies:
  dify_sandbox_conf:
  dify_plugin_storage:
  dify_nginx_ssl:
  dify_certbot_live:
  dify_certbot_conf:
  dify_certbot_www:
  dify_kb_assets:
  dify_kb_admin_data:
