# Serviço estático das imagens da base de conhecimento do chatbot.
# Publicado pelo NGPM em /kb-assets/ (ver docker/kb_assets/README.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    location /kb-assets/ {
        # Arquivos e diretórios ocultos (ex.: cópia temporária do publish.sh) nunca são servidos
        location ~ /\. {
            return 404;
        }
        # Caminhos de diretório respondem 404 (e não 403), sem revelar a estrutura
        location ~ /$ {
            return 404;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
