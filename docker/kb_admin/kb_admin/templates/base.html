<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Manuais da base de conhecimento{% endblock %}</title>
<script>
  // Aplica o tema antes de desenhar a página (sem piscar): escolha salva ou, sem ela, a do sistema.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("kb_admin_theme"); } catch (error) { theme = null; }
    if (theme !== "dark" && theme !== "light") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root { --bg: #f6f7f9; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #1f6feb;
          --danger: #cf222e; --warn-bg: #fff8c5; --err-bg: #ffebe9; --ok-bg: #dafbe1;
          --surface: #ffffff; --surface-2: #eff2f5; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #2f81f7;
          --danger: #da3633; --warn-bg: #3b2f05; --err-bg: #4a1b1e; --ok-bg: #12321f;
          --surface: #161b22; --surface-2: #21262d; color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px;
           display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: var(--fg); text-decoration: none; }
  header .env, small { color: var(--muted); }
  .tabs { display: flex; gap: 4px; }
  .tabs a { padding: 6px 10px; border-radius: 6px; color: var(--muted); }
  .tabs a.active { background: var(--surface-2); color: var(--fg); font-weight: 600; }
  header .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  header form { display: flex; gap: 8px; align-items: center; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin: 16px 0; }
  .msg { padding: 12px 16px; border-radius: 6px; margin: 12px 0; }
  .msg.error { background: var(--err-bg); } .msg.warn { background: var(--warn-bg); } .msg.ok { background: var(--ok-bg); }
  button, .button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px;
                    cursor: pointer; text-decoration: none; display: inline-block; font-size: 1em; }
  .danger { background: var(--danger); }
  .secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  code { background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
  .changed { background: var(--warn-bg); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .gallery figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .gallery img { width: 100%; height: auto; background: #fff; }
  input { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
  a { color: var(--accent); }
  .gallery figcaption { font-size: .8em; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<header>
  <a href="{{ prefix }}/"><strong>Manuais da base de conhecimento</strong></a>
  {% if user %}
  <nav class="tabs">
    <a href="{{ prefix }}/"{% if nav != "docs" %} class="active"{% endif %}>Manuais</a>
    <a href="{{ prefix }}/docs"{% if nav == "docs" %} class="active"{% endif %}>Documentos de apoio</a>
  </nav>
  {% endif %}
  <span class="env">Imagens publicadas em <code>{{ assets_base_url }}/</code></span>
  <div class="header-right">
    <button type="button" id="theme-toggle" class="secondary" title="Alternar modo claro/escuro">🌙 Modo escuro</button>
    {% if user %}
    <form method="post" action="{{ prefix }}/logout">
      <span class="env">{{ user.email }}</span>
      <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
      <button class="secondary" type="submit">Sair</button>
    </form>
    {% endif %}
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
  // Copia o valor do botão; sem https, navigator.clipboard não existe e usa-se o método antigo.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) { return navigator.clipboard.writeText(text); }
    var area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    return Promise.resolve();
  }
  // Botão de tema: mostra a opção oposta à atual e guarda a escolha no navegador.
  var themeToggle = document.getElementById("theme-toggle");
  function showThemeLabel() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    themeToggle.textContent = dark ? "☀️ Modo claro" : "🌙 Modo escuro";
  }
  themeToggle.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("kb_admin_theme", next); } catch (error) { /* navegador sem armazenamento */ }
    showThemeLabel();
  });
  showThemeLabel();
  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-copy]");
    if (!button) { return; }
    copyText(button.dataset.copy).then(function () {
      button.textContent = "Copiado";
      setTimeout(function () { button.textContent = "Copiar"; }, 1500);
    });
  });
</script>
</body>
</html>
